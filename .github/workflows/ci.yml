# ENCflow CI: ビルド+回帰テスト(基準 Log とのビット/ULP 照合)
#   高速な 18 ケースを毎 push で回す(chichibu は実行時間の都合で対象外。
#   ローカルで test/chichibu/Run.sh を実行すること)。prmap・wfswash・gwlateral・gwtani・stg・vshaped は
#   reference を持たない検定型(Check_*.py・再開と並列のバイト比較。Run.sh の終了コードで判定。
#   stg は STG 格子の動作確認で、MPI の 2 ランクでは初期化で止まることを確かめる。vshaped は
#   V 字流域の降雨流出の運動学的波の理論解との比較)
#   フル回帰・MPI np=1,2,4・-fcheck=all・BMI 適合性は夜間の nightly.yml で回す
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  serial:
    name: build + regression (serial)
    # reference の生成環境(開発 VM の gfortran 13)に合わせて固定。ubuntu-latest は 2026-11-05 に
    # ubuntu-26.04(gfortran 15)へ切り替わり、vzcol が 1 量子で不一致になった(developer.md §10)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gfortran make
      - name: Build
        run: make -C src install
      - name: Regression tests
        run: |
          set -e
          for c in wave dambreak frost pump conduit salt vzcol vzzone prmap wfshoal wfshadow wfcurrent wfsed wfswash gwlateral gwtani stg vshaped; do
            echo "===== test/$c ====="
            (cd "test/$c" && ./Run.sh)
          done

  mpi:
    name: build + regression (MPI np=2)
    # reference の生成環境(開発 VM の gfortran 13)に合わせて固定。ubuntu-latest は 2026-11-05 に
    # ubuntu-26.04(gfortran 15)へ切り替わり、vzcol が 1 量子で不一致になった(developer.md §10)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gfortran make openmpi-bin libopenmpi-dev
      - name: Build (MPI)
        run: make -C src MODE=mpi install
      - name: Regression tests (np=2)
        run: |
          set -e
          export OMP_NUM_THREADS=1
          for c in wave dambreak frost pump conduit salt vzcol vzzone prmap wfshoal wfshadow wfcurrent wfsed wfswash gwlateral gwtani stg vshaped; do
            echo "===== test/$c (np=2) ====="
            (cd "test/$c" && ./Run_MPI.sh 2)
          done
