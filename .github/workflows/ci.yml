# ENCflow CI: ビルド+回帰テスト(基準 Log とのビット/ULP 照合)
#   毎 push で、reference を持つ 14 ケースと、実行時間の短い検定型の 16 ケースを回す(逐次 30 ケース、うち 29 ケースは
#   MPI np=2 でも)。chichibu は実行時間の都合で対象外(ローカルで test/chichibu/Run.sh を実行すること)。test/paddy も
#   実行時間の都合で、夜間の nightly.yml だけで回す(developer.md §127.16)。実行時間の長い検定型の 5 ケース
#   (tjunction・stairbank・vchannel・bldgdrag・driftwood。ランナーで 1 本 2〜6 分)は、夜間の nightly.yml の
#   verify-serial・verify-mpi で回す(逐次のジョブが 30 分の制限で打ち切られていたため。developer.md §10)。src を
#   変える作業では、手元でこの 5 ケースも回すこと。
#   prmap・wfswash・gwlateral・gwtani・stg・vshaped・bankcap・brink・bankspill・chutepool・cascade・stageside・bankhalo・
#   wallpond・sliver は reference を持たない検定型(Check_*.py・再開と並列のバイト比較。Run.sh の終了コードで判定)。
#   stg は STG 格子の動作確認で、MPI の 2 ランクでは初期化で止まることを確かめる。
#   vshaped は V 字流域の降雨流出の運動学的波の理論解との比較。bankcap は、エッジ水深の頭打ち f_dry_head_cap = 2・3 と、
#   既定の 4 つの値の組み合わせで、河道の水が濡れた河岸へ登らないことの検定で、逐次と MPI の両方で回す(np = 2 では
#   河岸の列と河道の間が帯の境界になる)。brink は、池の出口の段落ちを 1 次元の理論と比べ、屈曲直後の辺の風上値
#   f_advection_bend = 1・2 で棚の上のエネルギー水頭が池を超えないこと、段落ちの先の池の跳水の位置が理論と合い、
#   足元の直後が斜めの水路が直線の水路と同じ水面形になること、幅 2 セルの水路の等流が 0 と 1・2 で同じ水深に
#   なること、合流部の池に落差から流れが入る構成で 1・2 の水面が定常に落ち着くことの検定(0 が揺れ続ける形の
#   池の記録を含む。古い値の組み合わせの組と、既定の 4 つの値の組み合わせの組を回す)。
#   逐次と MPI の両方で回す(np = 2 では、段落ちの直前・足元の直後の斜めの辺と、合流部の池が帯の境界をまたぐ)
#   bankspill は、河道の水が河岸のくぼみへあふれ始める水位が、まっすぐな区間では時間刻みによらないことの検定
#   (屈曲の正面のくぼみの時間刻み依存と、開いた瞬間の段は、f_dry_head_cap = 3 と既定の 4 つの値の組み合わせで
#   判定し、2 では限界として記録)。chutepool は、落差を落ちた射流が池へ落ち込む所(test/chichibu のデータの
#   切り出し)で、池の流量が揺れないことの検定(f_dry_head_cap = 2・3 と既定の 4 つの値の組み合わせで判定。3・4 は、
#   射流で入ってくる流れを、同じ流量の限界流の比エネルギーまでしか数えない)。cascade は、急な段々の河道
#   (test/chichibu の 50 m 格子のデータの切り出し)で、流れの水頭が上流端の水位を超えないことの検定
#   (f_dry_head_cap = 3 の 2 構成と既定の 4 つの値の組み合わせで、超える分が 10 m 未満を判定。2(2026-11-16 までの
#   既定)は、乾いた岸で 45 m 超えることを限界として記録)。この 3 つは逐次と MPI の両方で回す(np = 2 では、
#   屈曲の斜めの辺・池の北の端・段々の河道が帯の境界をまたぐ)
#   stageside は、境界として与えたセルの列(水位規定セル・湧き出し)が側方 Neumann の辺に接する配置の検定
#   (4 つの値の組み合わせが、与えたセルから出る水に静止からの加速を数えない扱いと、それを枠の中の面と側方
#   Neumann の境界面で同じにしていること。古い値の組み合わせと 4 つの値の組み合わせが、どちらも定常・岸沿いに
#   一様で、結果が一致することを判定する)。逐次と MPI の両方で回す(np = 2 では、北と南の側方 Neumann の辺を
#   別のランクが持つ)
#   river_flowline は、前処理 utils/river_flowline(河道マスクを標高の落水線に載せ直す)が、秩父の 4 つの格子の
#   置いてある載せ直し済みのマスクをバイト一致で作り直すことの検定で、逐次のジョブだけで回す(encflow は
#   使わない。Run.sh が utils/river_flowline をビルドする)
#   bankhalo は、堤防の越流の追い越し上限が帯の境で読む実効平面積率 af のハロの検定(閉じた箱の水の保存と、
#   深く潜った堤防を越えて両岸の水位差が縮まることを判定する)。逐次と MPI の両方で回す(MPI のジョブは
#   2 ランクと 1 ランクの Log・水位・水深をバイト比較する。帯の境が堤防付きの河道を横切る。developer.md §128)
#   wallpond は、河道の堤防・海岸堤防の仮想壁面の向こうに静かな池があっても、壁の手前の水位が、壁の向こうが乾いて
#   いる計算・解像した堤防の計算と変わらないことの検定(移流項が壁の向こうのセルを、濡れていても供給元・平行リンク・
#   開口に数えない。軸に沿う直線の河道と 45° の階段の河道、移流項の規則の組み合わせ 3 つとスキーム 1。海岸堤防は
#   開口の動的な振り替えで壁の向こうを塞がっていると数えることも見る。developer.md §134・§134.9)。
#   逐次と MPI の両方で回す(逐次はランナーで約 30 秒、MPI は約 1 分。MPI のジョブは湛水の 7 ケースを 2 ランクと
#   1 ランクで回して Log・水位・水深をバイト比較する。帯の境が河道と堤防を横切る。MPI は 2026-11-28 に足した。
#   developer.md §10)
#   sliver は、幅 0.01 m のサブグリッド河道のセル(占有率の細片)を河道に添えても、河道の水位が添えない計算と
#   変わらないことの検定(開口の動的な振り替えと通水率で、幅の極端に狭いセルを計算の外と同じに数える。45° の
#   1 列に 1 セルの河道と格子に沿う 2 行の河道。developer.md §137)。逐次と MPI の両方で回す(ランナーで数秒。
#   MPI のジョブは細片を添えた 2 ケースを 2 ランクと 1 ランクで回して Log・水位・水深をバイト比較する。帯の境が
#   河道と細片を横切る。MPI は 2026-11-28 に足した。developer.md §10)
#   フル回帰・MPI np=1,2,4・-fcheck=all・BMI 適合性と、上の実行時間の長い検定型の 5 ケースは、夜間の nightly.yml で回す
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  serial:
    name: build + regression (serial)
    # reference の生成環境(開発 VM の gfortran 13)に合わせて固定。ubuntu-latest は 2026-11-05 に
    # ubuntu-26.04(gfortran 15)へ切り替わり、vzcol が 1 量子で不一致になった(developer.md §10)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gfortran make
      - name: Build
        run: make -C src install
      - name: Regression tests
        run: |
          set -e
          for c in wave dambreak frost pump conduit salt vzcol vzzone sfzone prmap wfshoal wfshadow wfcurrent wfsed wfswash gwlateral gwtani stg vshaped bankcap brink bankspill chutepool cascade stageside river_flowline bankhalo wallpond sliver damops; do
            echo "===== test/$c ====="
            (cd "test/$c" && ./Run.sh)
          done

  mpi:
    name: build + regression (MPI np=2)
    # reference の生成環境(開発 VM の gfortran 13)に合わせて固定。ubuntu-latest は 2026-11-05 に
    # ubuntu-26.04(gfortran 15)へ切り替わり、vzcol が 1 量子で不一致になった(developer.md §10)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gfortran make openmpi-bin libopenmpi-dev
      - name: Build (MPI)
        run: make -C src MODE=mpi install
      - name: Regression tests (np=2)
        run: |
          set -e
          export OMP_NUM_THREADS=1
          for c in wave dambreak frost pump conduit salt vzcol vzzone sfzone prmap wfshoal wfshadow wfcurrent wfsed wfswash gwlateral gwtani stg vshaped bankcap brink bankspill chutepool cascade stageside bankhalo wallpond sliver damops; do
            echo "===== test/$c (np=2) ====="
            (cd "test/$c" && ./Run_MPI.sh 2)
          done
