# ENCflow CI: ビルド+回帰テスト(基準 Log とのビット/ULP 照合)
#   高速な 24 ケースを毎 push で回す(chichibu は実行時間の都合で対象外。
#   ローカルで test/chichibu/Run.sh を実行すること)。prmap・wfswash・gwlateral・gwtani・stg・vshaped・
#   bldgdrag・driftwood・bankcap・brink は reference を持たない検定型(Check_*.py・再開と並列のバイト比較。Run.sh の
#   終了コードで判定。stg は STG 格子の動作確認で、MPI の 2 ランクでは初期化で止まることを確かめる。
#   vshaped は V 字流域の降雨流出の運動学的波の理論解との比較。bldgdrag は家屋の抗力項を含む等流の
#   理論値との比較で、逐次のジョブだけで回す(辺ごとの局所の式で、MPI のジョブは同じ式を通るだけなので
#   足さない)。driftwood は流木の材積保存・集積の抵抗による堰上げの解析解・カルバートの流量則と流入口の
#   捕捉の検定で、逐次のジョブだけで回す(Run_MPI.sh の逐次の保存状態とのバイト比較は、-Ofast のビルド間の
#   差で警告扱いになるので、MPI のジョブには足さない)。bankcap は、エッジ水深の頭打ち f_dry_head_cap = 2 で
#   河道の水が濡れた河岸へ登らないことの検定で、逐次と MPI の両方で回す(np = 2 では河岸の列と河道の間が
#   帯の境界になる)。brink は、池の出口の段落ちを 1 次元の理論と比べ、屈曲直後の辺の風上値
#   f_advection_bend = 1 で棚の上のエネルギー水頭が池を超えないことの検定で、逐次と MPI の両方で回す
#   (np = 2 では、段落ちの直前の斜めの辺が帯の境界をまたぐ))
#   river_flowline は、前処理 utils/river_flowline(河道マスクを標高の落水線に載せ直す)が、秩父の 4 つの格子の
#   置いてある載せ直し済みのマスクをバイト一致で作り直すことの検定で、逐次のジョブだけで回す(encflow は
#   使わない。Run.sh が utils/river_flowline をビルドする)
#   フル回帰・MPI np=1,2,4・-fcheck=all・BMI 適合性は夜間の nightly.yml で回す
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  serial:
    name: build + regression (serial)
    # reference の生成環境(開発 VM の gfortran 13)に合わせて固定。ubuntu-latest は 2026-11-05 に
    # ubuntu-26.04(gfortran 15)へ切り替わり、vzcol が 1 量子で不一致になった(developer.md §10)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gfortran make
      - name: Build
        run: make -C src install
      - name: Regression tests
        run: |
          set -e
          for c in wave dambreak frost pump conduit salt vzcol vzzone sfzone prmap wfshoal wfshadow wfcurrent wfsed wfswash gwlateral gwtani stg vshaped bldgdrag driftwood bankcap brink river_flowline; do
            echo "===== test/$c ====="
            (cd "test/$c" && ./Run.sh)
          done

  mpi:
    name: build + regression (MPI np=2)
    # reference の生成環境(開発 VM の gfortran 13)に合わせて固定。ubuntu-latest は 2026-11-05 に
    # ubuntu-26.04(gfortran 15)へ切り替わり、vzcol が 1 量子で不一致になった(developer.md §10)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gfortran make openmpi-bin libopenmpi-dev
      - name: Build (MPI)
        run: make -C src MODE=mpi install
      - name: Regression tests (np=2)
        run: |
          set -e
          export OMP_NUM_THREADS=1
          for c in wave dambreak frost pump conduit salt vzcol vzzone sfzone prmap wfshoal wfshadow wfcurrent wfsed wfswash gwlateral gwtani stg vshaped bankcap brink; do
            echo "===== test/$c (np=2) ====="
            (cd "test/$c" && ./Run_MPI.sh 2)
          done
